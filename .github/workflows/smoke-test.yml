name: Production E2E Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Frontend URL to test'
        required: false
        default: 'https://lostlink-public-frontend-3znt.vercel.app'
  schedule:
    # Run once daily at midnight UTC as proactive health check
    - cron: '0 0 * * *'

concurrency:
  group: e2e-smoke-tests
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Playwright Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'lostfound-frontend/package.json'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ github.event.inputs.target_url || 'https://lostlink-public-frontend-3znt.vercel.app' }}
        run: |
          npx playwright test tests/e2e-smoke.spec.js --project=chromium --reporter=list

      - name: Upload Test Artifacts (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
