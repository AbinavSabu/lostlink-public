spring.application.name=LostLink
server.port=${PORT:8081}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# ========================================================
# Database Configuration (Environment-Driven)
# ========================================================
# In production, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# In local development without env vars, falls back to embedded file-based H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lostfounddb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Leave blank by default to allow Spring Boot to auto-detect driver (PostgreSQL or H2)
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=true

# H2 Web Console (Secure by default - disabled unless explicitly enabled for dev)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# File Storage Configuration ("local" or "cloudinary")
app.storage.provider=${STORAGE_PROVIDER:local}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
file.upload-dir=${app.upload.dir}

# Cloudinary Configuration (Populated via environment variables in production)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# CORS Configuration (Configure FRONTEND_URL=https://<your-vercel-app>.vercel.app in production)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (MUST be overridden with strong secret in production via JWT_SECRET)
jwt.secret=${JWT_SECRET:campus_lost_and_found_dev_secret_jwt_key_2026_min32chars!}